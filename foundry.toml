[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Kuru's current router uses Cancun transient-storage opcodes; Monad testnet supports Cancun.
# Shanghai simulation fails at the Kuru factory with EvmError::NotActivated.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
# Monad testnet (chainId: 10143)
monad_testnet = "https://testnet-rpc.monad.xyz"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
